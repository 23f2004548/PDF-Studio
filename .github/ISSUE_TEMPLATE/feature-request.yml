name: 🚀 Feature Request
description: Suggest a new feature or enhancement for PDF Studio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please fill out the details below.
  - type: textarea
    id: feature-description
    attributes:
      label: 🚀 Feature Description
      description: A clear and concise description of what you want to happen.
      placeholder: E.g., "Add a dark mode toggle button to the topbar..."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 💡 Rationale & Use Case
      description: Explain why this feature is useful. What problem does it solve?
      placeholder: E.g., "Helps reduce eye strain when reading PDFs at night."
    validations:
      required: true
  - type: textarea
    id: implementation-details
    attributes:
      label: 🛠️ Proposed Implementation Details
      description: Describe the design or implementation details you would like to see.
      placeholder: E.g., "Add custom HSL variables, store user preference in localStorage..."
  - type: checkboxes
    id: todo-list
    attributes:
      label: 📋 Development Checklist
      options:
        - label: Research implementation details and theme variables
        - label: Create the toggle button component (UI)
        - label: Define CSS variables for Light and Dark modes
        - label: Implement local state storage (localStorage) and default to system preferences
        - label: Verify accessibility and contrast ratios
